name: publish

on:
  push:
    tags: [ v* ]
  workflow_dispatch:

# 必须同时声明：缺 packages: write 会让 GitHub Packages 推送 403，缺 contents: write 无法创建 Release
permissions:
  contents: write
  packages: write

jobs:
  build-publish:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup dotNET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.x
          10.x
    - name: Get Version
      run: echo "VERSION=$(date '+%Y.%m%d')" >> $GITHUB_ENV
    - name: Build
      run: |
        dotnet pack --version-suffix ${{ env.VERSION }} -c Release -o out NewLife.OpcUa/NewLife.OpcUa.csproj
        dotnet pack --version-suffix ${{ env.VERSION }} -c Release -o out NewLife.OpcDa/NewLife.OpcDa.csproj
    - name: Publish to GitHub Packages
      id: ghpackages
      # 备用镜像渠道，失败只告警，不阻断 NuGet.org 正式发布
      continue-on-error: true
      run: |
        dotnet nuget push ./out/*.nupkg --skip-duplicate --source https://nuget.pkg.github.com/NewLifeX/index.json --api-key ${{ github.token }}
    - name: Publish to NuGet.org
      id: nuget
      run: |
        dotnet nuget push ./out/*.nupkg --skip-duplicate --source https://api.nuget.org/v3/index.json --api-key ${{ secrets.nugetKey }}
    - name: Create GitHub Release
      id: release
      # 仅 tag 推送时创建；手工触发（master 无 tag）只发包
      if: startsWith(github.ref, 'refs/tags/')
      # 观察期：失败只告警，不影响已完成的发包；结尾 Publish Summary 会显式标红
      continue-on-error: true
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail

        tag="${GITHUB_REF_NAME}"
        repo="${GITHUB_REPOSITORY}"

        # 幂等：同 tag 已有 Release 就直接跳过，失败重跑不会报错
        if gh release view "$tag" --repo "$repo" >/dev/null 2>&1; then
          echo "Release $tag 已存在，跳过"
          exit 0
        fi

        # 发布说明优先取 ChangeLog.md 中当前版本段落（标题形如 "## v1.1.2026.1024 (2026-10-24)"）
        version="${tag#v}"
        start=$(grep -nE "^## v?${version}([ (]|$)" ChangeLog.md | head -1 | cut -d: -f1 || true)

        assets=(out/*.nupkg out/*.snupkg)
        if [ -n "${start:-}" ]; then
          end=$(awk -v s="$start" 'NR > s && /^## / { print NR; exit }' ChangeLog.md)
          notes=release-notes.md
          if [ -n "${end:-}" ]; then
            sed -n "${start},$((end - 1))p" ChangeLog.md > "$notes"
          else
            tail -n +"$start" ChangeLog.md > "$notes"
          fi
          echo "发布说明取自 ChangeLog.md 的 $version 段落"
          gh release create "$tag" --repo "$repo" --title "$tag" --verify-tag --notes-file "$notes" "${assets[@]}"
        else
          echo "ChangeLog.md 未找到 $version 段落，改用自动生成说明"
          gh release create "$tag" --repo "$repo" --title "$tag" --verify-tag --generate-notes "${assets[@]}"
        fi
    - name: Publish Summary
      if: always()
      run: |
        rows=(
          "GitHub Packages|${{ steps.ghpackages.outcome }}"
          "NuGet.org|${{ steps.nuget.outcome }}"
          "GitHub Release|${{ steps.release.outcome }}"
        )
        {
          echo '### 发布结果'
          echo ''
          echo '| 渠道 | 结果 |'
          echo '| --- | --- |'
          for row in "${rows[@]}"; do
            name="${row%%|*}"
            outcome="${row##*|}"
            case "$outcome" in
              success) mark='✅' ;;
              failure) mark='⚠️' ;;
              skipped) mark='⏭' ;;
              cancelled) mark='⛔' ;;
              *) mark='⚠️' ;;
            esac
            echo "| $name | $mark $outcome |"
          done
          echo ''
          echo '> GitHub Release 仅 tag 推送时创建；手工触发只发包。'
        } >> "$GITHUB_STEP_SUMMARY"
